<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SWT302 SLR - SerpApi Google Scholar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>📚 Scholar Extractor</h1>
      <span class="badge badge-blue">REST API SLR</span>
    </div>
    <div id="backendStatusBadge" class="badge badge-yellow">● Đang kiểm tra Backend...</div>
  </header>

  <!-- Section 1: Thiet lap tim kiem & bo loc -->
  <div class="section-card">
    <div style="display: flex; gap: 8px; margin-bottom: 6px;">
      <div class="form-group" style="flex: 3; margin-bottom: 0;">
        <label for="queryInput">Chuỗi tìm kiếm nguyên văn (Search String):</label>
        <input type="text" id="queryInput" placeholder="Nhập chuỗi tìm kiếm nguyên văn...">
      </div>
      <div class="form-group" style="flex: 1; margin-bottom: 0;">
        <label for="backendUrlInput">Backend URL:</label>
        <input type="text" id="backendUrlInput" value="http://localhost:3001" placeholder="http://localhost:3001">
      </div>
    </div>
    <div style="margin-bottom: 8px; font-size: 11px; color: #4b5563; display: flex; align-items: center; gap: 6px;">
      <span>Gợi ý chuỗi (protocol):</span>
      <button type="button" id="loadStringABtn" class="btn-preset">String A (Chính thức)</button>
      <button type="button" id="loadStringBBtn" class="btn-preset">String B (Dự phòng)</button>
    </div>

    <div class="filter-grid">
      <div class="form-group">
        <label for="asYloInput">Từ năm (as_ylo):</label>
        <input type="text" id="asYloInput" value="2020">
      </div>
      <div class="form-group">
        <label for="asYhiInput">Đến năm (as_yhi):</label>
        <input type="text" id="asYhiInput" value="2026">
      </div>
      <div class="form-group">
        <label for="hlInput">Ngôn ngữ (hl):</label>
        <input type="text" id="hlInput" value="vi">
      </div>
      <div class="form-group">
        <label for="maxPagesInput">Giới hạn trang:</label>
        <input type="number" id="maxPagesInput" value="1" min="1" max="10">
      </div>
    </div>

    <div class="form-group">
      <label for="uiTotalInput">Số kết quả xem trên Web Scholar (để đối chiếu đối soát, tùy chọn):</label>
      <input type="number" id="uiTotalInput" placeholder="Ví dụ: 18200 (số hiển thị trên Google Scholar thực địa)">
    </div>

    <div class="button-group">
      <button id="searchFirstBtn" class="btn-primary">🔍 Lấy trang 1 (start=0)</button>
      <button id="nextBtn" class="btn-secondary" style="display: none;">⏩ Lấy trang tiếp (+10)</button>
      <button id="autoFetchBtn" class="btn-secondary" style="display: none;">⚡ Lấy tối đa trang đã đặt</button>
      <button id="stopBtn" class="btn-danger" style="display: none;">⏹ Dừng / Hủy</button>
      <button id="resetBtn" class="btn-secondary" style="display: none; background: #fee2e2; color: #991b1b; border-color: #fca5a5;">🗑️ Xóa phiên / Làm mới</button>
    </div>

    <div id="status">Sẵn sàng thu thập dữ liệu Google Scholar.</div>
  </div>

  <!-- Section 2: Bang thong ke & metrics -->
  <div id="statsBox" class="section-card" style="display: none;"></div>

  <!-- Section 3: Bo loc cuc bo & danh sach bai bao -->
  <div class="section-card">
    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
      <input type="text" id="filterInput" placeholder="🔎 Lọc nhanh trong kết quả thu thập..." style="flex: 2;">
      <select id="filterDecisionSelect" style="flex: 1;">
        <option value="all">Tất cả quyết định</option>
        <option value="Include">Chỉ Include</option>
        <option value="Exclude">Chỉ Exclude</option>
        <option value="Unsure">Chỉ Unsure</option>
      </select>
      <button id="extractActiveTabBtn" class="btn-secondary" style="display: none; background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; white-space: nowrap; font-size: 11px;">📑 Lấy từ Tab Đang Mở</button>
      <button id="uploadPdfBtn" class="btn-secondary" style="display: none; background: #fef3c7; color: #92400e; border-color: #fde68a; white-space: nowrap; font-size: 11px;">📁 Tải file PDF</button>
      <input type="file" id="pdfFileInput" accept="application/pdf,.pdf" style="display: none;">
    </div>

    <div id="resultsContainer">
      <div class="empty-state">Chưa có dữ liệu. Bấm "Lấy trang 1" để bắt đầu thu thập.</div>
    </div>

    <div class="button-group" style="margin-top: 10px;">
      <button id="exportCsvBtn" class="btn-success" style="display: none;">📥 Tải 01_all_records.csv (Metadata chuẩn PRISMA)</button>
      <button id="exportScreeningBtn" class="btn-primary" style="display: none;">📊 Tải 02_screening_decisions.csv (Đầy đủ Quyết định & Ghi chú)</button>
      <button id="saveLogBtn" class="btn-secondary" style="display: none;">💾 Ghi vào search-log.md (Nguồn bổ trợ)</button>
      <button id="exportSessionBtn" class="btn-secondary" style="display: none;">📦 Tải Backup Toàn Phiên (Session JSON)</button>
    </div>
  </div>

  <!-- Modal: Xem truoc va Xac nhan trich xuat du lieu tu Tab dang mo -->
  <div id="tabExtractModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📑 Xem trước & Xác nhận Trích xuất từ Tab Đang Mở</h3>
        <button id="closeModalBtn" class="btn-close">&times;</button>
      </div>
      <div id="modalBody" class="modal-body">
        <!-- Content will be dynamically populated -->
      </div>
      <div class="modal-footer">
        <button id="confirmTabExtractBtn" class="btn-success">✓ Xác nhận Cập nhật (Ghi nhận Provenance)</button>
        <button id="cancelTabExtractBtn" class="btn-secondary">✕ Hủy bỏ (Giữ nguyên dữ liệu cũ)</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
